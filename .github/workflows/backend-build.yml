name: Build Java Backend

on:
  push:
    branches:
      - main
      - agents/simple-website-creation-git-integration

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build backend
        run: |
          cd backend
          mvn -B -DskipTests package
